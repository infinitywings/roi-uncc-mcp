# Attacker Constraints - MUST be identical for AI and Random
# This ensures fair comparison: only decision logic differs.

observation:
  interval_sec: 5.0

action:
  min_cooldown_sec: 30.0
  max_attacks_per_hour: 60

power:
  # Original attack power range restored now that rate-limited ramping is enabled.
  # Ramping (100 kW/s) prevents GridLAB-D Newton-Raphson solver crashes.
  min_kw: 1500.0
  max_kw: 3500.0

targets:
  valid_ev_ids: ["EV1", "EV2", "EV3", "EV4", "EV5", "EV6"]

grid:
  threshold_kw: 4200.0

