server:
  host: "0.0.0.0"
  port: 5100

# Path to constraints file (relative to working directory)
constraints_path: "config/constraints.yaml"

helics:
  name: "ev_attacker_mcp"
  broker_address: "tcp://localhost:23404"
  core_type: "zmq"
  # Simulation time step to request on each observation.
  # Must match observation_interval_sec in constraints.yaml for proper timing.
  period_sec: 5.0
  offset_sec: 0.0

grid:
  threshold_kw: 4200.0
  nominal_voltage_v: 2401.7771
  # Used to translate simulation_time_sec into a wallclock-like timestamp for peak-hour logic.
  simulation_start_iso: "2013-08-28T00:00:00-05:00"

timing:
  # IMPORTANT: Must match update_interval in 1bc_EV_Controller.py (currently 60s)
  # The AI attacker uses this to estimate optimal attack windows.
  controller_interval_sec: 60.0
  macro_weight: 0.6
  micro_weight: 0.4
  history_size: 200

ai:
  # Only attack when micro-timing score is at or above this threshold
  micro_score_threshold: 70

ramping:
  # Rate-limited power ramping to prevent GridLAB-D Newton-Raphson solver crashes.
  # When enabled, power changes are gradual (100 kW/s) instead of step changes.
  enabled: true
  # Maximum power change rate in kW per second.
  # At 5s interval: max 500 kW per step.
  # Time to ramp from 200 kW to 2500 kW: ~23 seconds (5 timesteps).
  ramp_rate_kw_per_sec: 100.0

logging:
  level: "INFO"

