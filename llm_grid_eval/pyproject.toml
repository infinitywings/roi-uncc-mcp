[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-grid-eval"
version = "0.1.0"
description = "LLM-GridEval: timing-aware attacker evaluation framework for HELICS grid co-simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "helics>=3.4",
]

[project.optional-dependencies]
drivers = [
  "httpx>=0.27",
  "openai>=1.40",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

