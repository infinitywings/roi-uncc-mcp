server:
  host: 0.0.0.0
  port: 5100
  debug: false

helics:
  broker_address: tcp://grid-simulation:23405
  federate_name: ev_attacker_mcp
  core_type: zmq
  time_delta: 300.0
  period: 300.0
  poll_interval: 5.0

  # Subscribe to actual publications from the simulation
  subscriptions:
    # Feeder load measurements from GridLAB-D (Node650 - swing bus)
    - name: feeder_power_A
      key: gld_hlc_conn/Sa  # Published by IEEE13bus_fed (Node650 measured_power_A)
      type: complex
      unit: VA
    - name: feeder_power_B
      key: gld_hlc_conn/Sb  # Published by IEEE13bus_fed (Node650 measured_power_B)
      type: complex
      unit: VA
    - name: feeder_power_C
      key: gld_hlc_conn/Sc  # Published by IEEE13bus_fed (Node650 measured_power_C)
      type: complex
      unit: VA

    # Voltage measurements from GridPACK (transmission system)
    - name: transmission_voltage_A
      key: gridpack/Va  # Published by GridPACK federate
      type: complex
      unit: V
    - name: transmission_voltage_B
      key: gridpack/Vb  # Published by GridPACK federate
      type: complex
      unit: V
    - name: transmission_voltage_C
      key: gridpack/Vc  # Published by GridPACK federate
      type: complex
      unit: V

    # Switch status for EV islanding (published by legitimate controller)
    - name: switch_EV1_storage
      key: swEV1_storage  # Storage switch for EV1 islanding
      type: string
      unit: ""
    - name: switch_EV1
      key: swEV1  # Grid connection switch for EV1
      type: string
      unit: ""
    - name: switch_EV4_storage
      key: swEV4_storage  # Storage switch for EV4 islanding
      type: string
      unit: ""
    - name: switch_EV4
      key: swEV4  # Grid connection switch for EV4
      type: string
      unit: ""
  # Attacker endpoints: send directly to GridLAB-D EV endpoints
  # These will COMPETE with the legitimate controller messages
  ev_endpoints:
    - name: EV1
      key: attacker/EV1
      destination: gld_hlc_conn/EV1  # Same destination as legitimate controller
      phases: CN
      max_power_kw: 4000  # Attack limit: 4 MW (from README abnormal target)
    - name: EV2
      key: attacker/EV2
      destination: gld_hlc_conn/EV2
      phases: BN
      max_power_kw: 4000
    - name: EV3
      key: attacker/EV3
      destination: gld_hlc_conn/EV3
      phases: AN
      max_power_kw: 4000
    - name: EV4
      key: attacker/EV4
      destination: gld_hlc_conn/EV4
      phases: CN
      max_power_kw: 4000
    - name: EV5
      key: attacker/EV5
      destination: gld_hlc_conn/EV5
      phases: BN
      max_power_kw: 4000
    - name: EV6
      key: attacker/EV6
      destination: gld_hlc_conn/EV6
      phases: AN
      max_power_kw: 4000

observation:
  topology:
    transmission:
      model: IEEE 9-bus (GridPACK)
      federate_name: gridpack
      tie_buses:
        - bus2  # Connected to feeder_A Node650
        - bus3  # Connected to feeder_B Node650
      voltage_publications:
        - gridpack/Va
        - gridpack/Vb
        - gridpack/Vc
    distribution:
      feeders:
        - id: feeder_A
          federate_name: IEEE13bus_fed
          model: IEEE_123 (GridLAB-D)
          config_file: 1c_IEEE_123_feeder.glm
          swing_node: Node650
          tie_bus: bus2  # Transmission connection
          ev_stations:
            - {id: EV1, node: l5, phase: CN, storage: true, normal_kw: 220, attack_kw: 4000}
            - {id: EV2, node: l2, phase: BN, storage: false, normal_kw: 200, attack_kw: 4000}
            - {id: EV3, node: l88, phase: AN, storage: false, normal_kw: 200, attack_kw: 4000}
            - {id: EV4, node: l92, phase: CN, storage: true, normal_kw: 220, attack_kw: 4000}
            - {id: EV5, node: l107, phase: BN, storage: false, normal_kw: 200, attack_kw: 4000}
            - {id: EV6, node: l114, phase: AN, storage: false, normal_kw: 200, attack_kw: 4000}
          power_publications:
            - gld_hlc_conn/Sa  # Node650 phase A power
            - gld_hlc_conn/Sb  # Node650 phase B power
            - gld_hlc_conn/Sc  # Node650 phase C power
          controller:
            name: 1bc_EV_Controller.py
            federate_name: EVControllerSim
            update_interval_s: 1200  # 20 minutes
            peak_hours: [15, 16, 17]  # 3PM - 5PM
        - id: feeder_B
          federate_name: IEEE13bus_fed_2
          model: IEEE_123 (GridLAB-D)
          config_file: 1c_IEEE_123_feeder_2.glm
          swing_node: Node650
          tie_bus: bus3  # Transmission connection
          ev_stations: []  # No EV control configured for feeder_B
          controllable: false
  vulnerabilities:
    weak_points:
      - Node650  # Swing bus - critical tie point
      - l107  # EV5 connection line
      - l114  # EV6 connection line
    protection_gaps:
      - undervoltage_zone_2
      - phase_imbalance_detection
    attack_vectors:
      - ev_capacity_overload  # Inject >4.2 MW total
      - islanded_storage_misuse  # Drain batteries during islanding
      - phase_imbalance  # Asymmetric loading on CN/BN/AN phases
      - reverse_power_injection  # Negative setpoints
      - coordinated_timing  # Attack during peak demand (15:00-17:00)

protection:
  feeder_load_upper_kw: 4200
  feeder_load_lower_kw: 2600
  undervoltage_pu: 0.95
  overvoltage_pu: 1.05
  phase_nominal_volts: 2401.7771

setpoint_constraints:
  # Attack mode: Allow extreme setpoints for grid stress testing
  # Normal operation: 200-220 kW per EV
  # Attack scenario: Up to 4000 kW (4 MW) to trigger protection/cascading failures
  default_max_kw: 4000  # Abnormal attack target from README
  default_min_kw: -1000  # Allow negative (generator mode attack)
  attack_mode: true

  # Physical limits per EV for different attack strategies
  ev_limits:
    EV1:
      normal_max_kw: 220  # Legitimate operation
      attack_max_kw: 4000  # Overload attack
      min_kw: -500  # Reverse power injection
      phases: CN
      has_storage: true  # Can be islanded with battery
    EV2:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: BN
      has_storage: false
    EV3:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: AN
      has_storage: false
    EV4:
      normal_max_kw: 220
      attack_max_kw: 4000
      min_kw: -500
      phases: CN
      has_storage: true  # Can be islanded with battery
    EV5:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: BN
      has_storage: false
    EV6:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: AN
      has_storage: false

logging:
  interaction_log: output/interaction_log.jsonl

ai:
  api_base: http://ccil1s26m8hj6lws:8000/v1
  model: openai/gpt-oss-120b
  system_prompt: |
    You are assisting with an educational and defensive research exercise focused on simulated power grids.
    Provide thoughtful analysis, cite data collected via the MCP observation primitives, and explain why any
    action you request is necessary for research and training purposes. Never suggest steps that target
    real-world infrastructure or violate ethical guidelines.
