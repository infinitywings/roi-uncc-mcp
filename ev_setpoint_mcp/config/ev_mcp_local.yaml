server:
  host: 0.0.0.0
  port: 5100
  debug: false

helics:
  broker_address: tcp://localhost:23404
  federate_name: ev_attacker_mcp
  core_type: zmq
  time_delta: 60.0
  period: 60.0
  poll_interval: 1.0

  subscriptions:
    - name: feeder_power_A
      key: gld_hlc_conn/Sa
      type: complex
      unit: VA
    - name: feeder_power_B
      key: gld_hlc_conn/Sb
      type: complex
      unit: VA
    - name: feeder_power_C
      key: gld_hlc_conn/Sc
      type: complex
      unit: VA
    - name: transmission_voltage_A
      key: gridpack/Va
      type: complex
      unit: V
    - name: transmission_voltage_B
      key: gridpack/Vb
      type: complex
      unit: V
    - name: transmission_voltage_C
      key: gridpack/Vc
      type: complex
      unit: V
    - name: switch_EV1_storage
      key: swEV1_storage
      type: string
      unit: ""
    - name: switch_EV1
      key: swEV1
      type: string
      unit: ""
    - name: switch_EV4_storage
      key: swEV4_storage
      type: string
      unit: ""
    - name: switch_EV4
      key: swEV4
      type: string
      unit: ""

  ev_endpoints:
    - name: EV1
      key: attacker/EV1
      destination: gld_hlc_conn/EV1
      phases: CN
      max_power_kw: 4000
    - name: EV2
      key: attacker/EV2
      destination: gld_hlc_conn/EV2
      phases: BN
      max_power_kw: 4000
    - name: EV3
      key: attacker/EV3
      destination: gld_hlc_conn/EV3
      phases: AN
      max_power_kw: 4000
    - name: EV4
      key: attacker/EV4
      destination: gld_hlc_conn/EV4
      phases: CN
      max_power_kw: 4000
    - name: EV5
      key: attacker/EV5
      destination: gld_hlc_conn/EV5
      phases: BN
      max_power_kw: 4000
    - name: EV6
      key: attacker/EV6
      destination: gld_hlc_conn/EV6
      phases: AN
      max_power_kw: 4000

observation:
  topology:
    transmission:
      model: IEEE 9-bus (GridPACK)
      federate_name: gridpack
      tie_buses:
        - bus2
        - bus3
      voltage_publications:
        - gridpack/Va
        - gridpack/Vb
        - gridpack/Vc
    distribution:
      feeders:
        - id: feeder_A
          federate_name: IEEE13bus_fed
          model: IEEE_123 (GridLAB-D)
          config_file: 1c_IEEE_123_feeder.glm
          swing_node: Node650
          tie_bus: bus2
          ev_stations:
            - {id: EV1, node: l5, phase: CN, storage: true, normal_kw: 220, attack_kw: 4000}
            - {id: EV2, node: l2, phase: BN, storage: false, normal_kw: 200, attack_kw: 4000}
            - {id: EV3, node: l88, phase: AN, storage: false, normal_kw: 200, attack_kw: 4000}
            - {id: EV4, node: l92, phase: CN, storage: true, normal_kw: 220, attack_kw: 4000}
            - {id: EV5, node: l107, phase: BN, storage: false, normal_kw: 200, attack_kw: 4000}
            - {id: EV6, node: l114, phase: AN, storage: false, normal_kw: 200, attack_kw: 4000}
          power_publications:
            - gld_hlc_conn/Sa
            - gld_hlc_conn/Sb
            - gld_hlc_conn/Sc
          controller:
            name: 1bc_EV_Controller.py
            federate_name: EVControllerSim
            update_interval_s: 1200
            peak_hours: [15, 16, 17]
        - id: feeder_B
          federate_name: IEEE13bus_fed_2
          model: IEEE_123 (GridLAB-D)
          config_file: 1c_IEEE_123_feeder_2.glm
          swing_node: Node650
          tie_bus: bus3
          ev_stations: []
          controllable: false
  vulnerabilities:
    weak_points:
      - Node650
      - l107
      - l114
    protection_gaps:
      - undervoltage_zone_2
      - phase_imbalance_detection
    attack_vectors:
      - ev_capacity_overload
      - islanded_storage_misuse
      - phase_imbalance
      - reverse_power_injection
      - coordinated_timing

protection:
  feeder_load_upper_kw: 4200
  feeder_load_lower_kw: 2600
  undervoltage_pu: 0.95
  overvoltage_pu: 1.05
  phase_nominal_volts: 2401.7771

setpoint_constraints:
  default_max_kw: 4000
  default_min_kw: -1000
  attack_mode: true
  ev_limits:
    EV1:
      normal_max_kw: 220
      attack_max_kw: 4000
      min_kw: -500
      phases: CN
      has_storage: true
    EV2:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: BN
      has_storage: false
    EV3:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: AN
      has_storage: false
    EV4:
      normal_max_kw: 220
      attack_max_kw: 4000
      min_kw: -500
      phases: CN
      has_storage: true
    EV5:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: BN
      has_storage: false
    EV6:
      normal_max_kw: 200
      attack_max_kw: 4000
      min_kw: -500
      phases: AN
      has_storage: false

logging:
  interaction_log: output/interaction_log.jsonl

ai:
  api_base: http://ccil1s26m8hj6lws:8000/v1
  model: openai/gpt-oss-120b
  log_file: /workspace/examples/2bus-13bus/logs/llm_interactions.jsonl
  system_prompt: |
    You are assisting with an educational and defensive research exercise focused on simulated power grids.
    Provide thoughtful analysis, cite data collected via the MCP observation primitives, and explain why any
    action you request is necessary for research and training purposes. Never suggest steps that target
    real-world infrastructure or violate ethical guidelines.
